<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#050711">
  <title>TOOLGOOL // Link Hub</title>
  <link rel="stylesheet" href="./style.css">
  <script src="./data.js" defer></script>
  <script src="./script.js" defer></script>
</head>
<body>
  <video id="bgVideo" autoplay muted loop playsinline preload="auto" aria-hidden="true">
    <source src="./image/VID_20261104_135345_408.mp4" type="video/mp4">
  </video>

  <canvas id="stars"></canvas>
  <canvas id="fx"></canvas>
  <div class="noise"></div>
  <div class="scanlines"></div>
  <div class="cursorGlow" id="cursorGlow"></div>

  <main class="wrap">
    <div class="topline">
      <span>TL NETWORK // PERSONAL HUB</span>
      <span class="live"><b></b> SYSTEM ONLINE</span>
    </div>

    <header class="hero">
      <div class="emblem">
        <div class="ring"></div>
        <div class="logo">TL</div>
      </div>
      <h1>TOOL<span>GOOL</span></h1>
      <div class="subtitle">Digital space • links • identity</div>
      <div class="heroLine"></div>
    </header>

    <section class="grid">
      <article class="panel">
        <div class="panelHead">
          <h2><i class="symbol">↗</i> Quick links</h2>
          <span class="count">01 / LINKS</span>
        </div>
        <div class="items" id="links"></div>
      </article>

      <article class="panel">
        <div class="panelHead">
          <h2><i class="symbol">✉</i> Gmail • click to copy</h2>
          <span class="count">02 / MAIL</span>
        </div>
        <div class="items" id="emails"></div>
      </article>

      <article class="panel full">
        <div class="panelHead">
          <h2><i class="symbol">ϟ</i> Manage trolling • click to copy</h2>
          <span class="count">03 / PHRASES</span>
        </div>
        <div class="items phrases" id="phrases"></div>
      </article>
    </section>

    <footer class="footer">
      <div class="footline"></div>
      BUILT BY <strong>@TOOLGOOL</strong>
      &nbsp;•&nbsp; TLmoomooio.duckdns.org
    </footer>
  </main>

  <div class="toast" id="toast">Copied</div>
</body>
</html>
