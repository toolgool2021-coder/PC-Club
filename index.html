<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080a12">
  <title>Toolgool | Links</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="background-overlay"></div>
  <main class="page">
    <header class="hero">
      <div class="eyebrow"><span class="status-dot"></span> PERSONAL LINK HUB</div>
      <h1>TOOLGOOL<span>.</span></h1>
      <p class="subtitle">Everything in one place.</p>
      <div class="hero-line"></div>
    </header>

    <section class="section">
      <div class="section-heading">
        <span class="section-index">01</span>
        <div><h2>LINKS</h2><p>Quick access to websites</p></div>
      </div>
      <div class="link-grid" id="links-list"></div>
    </section>

    <section class="section">
      <div class="section-heading">
        <span class="section-index">02</span>
        <div><h2>GMAIL</h2><p>Tap an address to copy it</p></div>
      </div>
      <div class="copy-list" id="emails-list"></div>
    </section>

    <section class="section">
      <div class="section-heading">
        <span class="section-index">03</span>
        <div><h2>MANAGE TROLLING</h2><p>Click any phrase to copy</p></div>
      </div>
      <div class="phrase-grid" id="phrases-list"></div>
    </section>

    <footer>
      <a class="website-link" href="https://tlmoomoo.duckdns.org/" target="_blank" rel="noopener">
        <span class="website-label">MY WEBSITE</span>
        <span>TLmoomoo.duckdns.org</span>
        <span class="external">↗</span>
      </a>
      <p class="footer-note">TOOLGOOL <span>•</span> PERSONAL SPACE</p>
    </footer>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite">Copied</div>
  <script src="js/data.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
